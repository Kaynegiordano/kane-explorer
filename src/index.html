<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kane Explorer</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="creative.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <img src="logo.svg" alt="" width="26" height="26">
      <span>Kane Explorer</span>
    </div>
    <nav>
      <button class="nav-item" data-path="::home">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Accueil</span>
      </button>
      <div id="pin-zone" data-pin-zone>
        <div class="nav-title" id="pinned-title">Épinglés</div>
        <div id="nav-pinned"></div>
        <div class="nav-hint" id="pin-hint">Glissez ici un dossier ou un fichier pour l’épingler</div>
      </div>
      <div class="nav-title">Accès rapide</div>
      <div id="nav-places"></div>
      <div id="shelf-zone" data-shelf-zone>
        <div class="nav-title">Étagère <span id="shelf-count" class="count"></span></div>
        <div id="nav-shelf"></div>
        <div class="nav-hint" id="shelf-hint">Déposez ici des éléments de plusieurs dossiers, puis copiez-les ou déplacez-les d’un coup</div>
        <div class="shelf-actions" id="shelf-actions" hidden>
          <button data-shelf="copy" title="Copier tout dans le dossier affiché">Copier ici</button>
          <button data-shelf="move" title="Déplacer tout dans le dossier affiché">Déplacer ici</button>
          <button data-shelf="dragall" title="Glisser tout vers un autre logiciel">Glisser</button>
          <button data-shelf="clear" title="Vider l’étagère">✕</button>
        </div>
      </div>
      <div class="nav-title">Lecteurs</div>
      <div id="nav-drives"></div>
    </nav>
    <button class="nav-item settings-btn" id="btn-options" title="Options des dossiers (Ctrl+,)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>Options des dossiers</span>
    </button>
  </aside>

  <main>
    <div class="tabbar" id="tabbar">
      <div class="tabs" id="tabs"></div>
      <button class="icon-btn new-tab" id="btn-newtab" title="Nouvel onglet (Ctrl+T)">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <header class="toolbar">
      <div class="nav-buttons">
        <button class="icon-btn" id="btn-back" title="Précédent (Alt+←)">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="icon-btn" id="btn-forward" title="Suivant (Alt+→)">
          <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="icon-btn" id="btn-up" title="Dossier parent (Retour arrière)">
          <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
        <button class="icon-btn" id="btn-refresh" title="Actualiser (F5)">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        </button>
      </div>

      <div class="address" id="address">
        <div class="crumbs" id="crumbs"></div>
        <input id="address-input" spellcheck="false" hidden>
      </div>

      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" placeholder="Rechercher dans ce dossier" spellcheck="false">
      </label>
    </header>

    <div class="actionbar">
      <button class="act" id="act-newfolder" title="Nouveau dossier (Ctrl+Maj+N)">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 10v6M9 13h6"/></svg>
        <span>Nouveau</span>
      </button>
      <span class="sep"></span>
      <button class="act" id="act-cut" title="Couper (Ctrl+X)">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8 16 19 4M16 16 5 4"/></svg>
      </button>
      <button class="act" id="act-copy" title="Copier (Ctrl+C)">
        <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
      </button>
      <button class="act" id="act-paste" title="Coller (Ctrl+V)">
        <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11h6M9 15h4"/></svg>
      </button>
      <button class="act" id="act-rename" title="Renommer (F2)">
        <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg>
      </button>
      <button class="act" id="act-delete" title="Envoyer à la Corbeille (Suppr)">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
      </button>
      <span class="sep"></span>
      <button class="act" id="act-props" title="Propriétés (Alt+Entrée)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>
      </button>
      <button class="act" id="act-terminal" title="Ouvrir dans le Terminal">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>
      </button>
      <button class="act" id="act-more" title="Plus d'options Windows (Maj+clic droit)">
        <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>
      </button>
      <span class="grow"></span>
      <button class="act" id="act-hidden" title="Afficher les éléments masqués (Ctrl+H)">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="act" id="act-preview" title="Volet d'aperçu (Alt+P)">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/></svg>
        <span>Aperçu</span>
      </button>
      <div class="segmented">
        <button class="act" id="view-list" title="Liste (Ctrl+1)">
          <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        </button>
        <button class="act" id="view-grid" title="Grandes icônes (Ctrl+2)">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </button>
      </div>
    </div>

    <div class="workspace">
      <section class="content" id="content" tabindex="0"></section>
      <div class="splitter" id="splitter" hidden></div>
      <aside class="preview" id="preview" hidden></aside>
    </div>

    <footer class="status">
      <span id="status-count"></span>
      <span id="status-sel"></span>
      <span id="status-extra" class="status-extra"></span>
    </footer>
  </main>

  <div class="menu" id="menu" hidden></div>
  <div class="modal-backdrop" id="modal" hidden><div class="modal" id="modal-box" role="dialog" aria-modal="true"></div></div>
  <div class="toasts" id="toasts"></div>

  <script src="main.js"></script>
  <script src="features.js"></script>
  <script src="pins.js"></script>
  <script src="tools.js"></script>
</body>
</html>
